[project]
name = "claude-adapt-rules"
version = "0.1.10"
description = "Mine Claude Code sessions for corrections; distil them into global and per-repo rules."
requires-python = ">=3.12"
# Runtime is stdlib-only on purpose: the SessionEnd hook imports this package on
# every session exit, and a broken dependency there would break unrelated work.
dependencies = []

[project.scripts]
claude-adapt-rules = "claude_adapt_rules.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "ty>=0.0.1a1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_adapt_rules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
